<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>指示語特訓プリントメーカー レベル1</title>

<style>

/* =========================================================
   基本
========================================================= */

:root{
    --brand:#7B3FC6;
    --brand-dark:#5A258F;
    --brand-light:#F0E6FA;
    --line:#B99AD3;
    --accent:#F28C28;
}

@page{
    size:A4 landscape;
    margin:0;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    font-family:
        "UD デジタル 教科書体",
        "UD Digi Kyokasho",
        "教科書体",
        "Yu Kyokasho",
        "Noto Serif JP",
        serif;

    background:#eeeeee;
    color:#333;
}



/* =========================================================
   編集画面
========================================================= */

.editor{
    max-width:1100px;
    margin:0 auto;
    padding:24px;
}

.editorTitle{
    color:var(--brand);
    margin:0 0 6px;
    font-size:28px;
}

.editorLead{
    color:#666;
    margin:0 0 20px;
}

.panel{
    background:#fff;
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.panelTitle{
    margin:0 0 12px;
    color:var(--brand);
    font-size:18px;
}

.help{
    background:#f7f2fb;
    border-left:4px solid var(--brand);
    padding:12px 14px;
    line-height:1.7;
    font-size:14px;
    margin-bottom:12px;
}

textarea{
    width:100%;
    height:420px;

    padding:14px;

    border:1px solid #ccc;
    border-radius:6px;

    resize:vertical;

    font-family:
        "UD デジタル 教科書体",
        "UD Digi Kyokasho",
        "教科書体",
        "Yu Kyokasho",
        "Noto Serif JP",
        serif;

    font-size:15px;
    line-height:1.7;
}

.settings{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.settings label{
    font-weight:bold;
    color:#555;
}

.settings input{
    padding:8px 10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:6px;
    padding:11px 20px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.makeButton{
    background:var(--brand);
    color:white;
}

.sampleButton{
    background:#eee;
    color:#555;
}

.printButton{
    background:#e88a32;
    color:white;
}



/* =========================================================
   印刷領域
========================================================= */

.printArea{
    display:none;
}



/* =========================================================
   生徒用ページ
========================================================= */

.studentPage{

    width:297mm;
    height:210mm;

    background:#fff;

    position:relative;

    padding:
        9mm
        8mm
        8mm
        10mm;

    overflow:hidden;
}



/* =========================================================
   生徒用メインレイアウト
========================================================= */

.studentLayout{

    width:100%;
    height:100%;

    position:relative;
}



/* =========================================================
   右側サイドバー
========================================================= */

.studentSidebar{

    position:absolute;

    top:0;
    right:3mm;

    width:25mm;
    height:190mm;

    display:flex;
    flex-direction:column;

    align-items:center;

    padding-top:1mm;

    z-index:10;
}



/* =========================================================
   タイトル
========================================================= */

.sideTitle{

    background:var(--brand) !important;
    color:#fff !important;

    width:10mm;

    padding:5mm 2mm;

    border-radius:5px;

    writing-mode:vertical-rl;
    text-orientation:mixed;

    text-align:center;

    font-size:16px;
    font-weight:bold;

    letter-spacing:1px;

    line-height:1.3;

    flex:none;
}



/* =========================================================
   レベル
========================================================= */

.sideLevel{

    background:var(--brand) !important;
    color:#fff !important;

    width:10mm;

    margin-top:3mm;

    padding:3mm 2mm;

    border-radius:5px;

    text-orientation:mixed;

    text-align:center;

    font-weight:bold;

    line-height:1.3;

    flex:none;
}



/* =========================================================
   名前
========================================================= */

.sideName{

    width:20mm;

    margin-top:7mm;

    writing-mode:vertical-rl;

    font-size:13px;
    font-weight:bold;

    color:#333;

    line-height:1.8;

    text-align:center;

    flex:none;
}



/* =========================================================
   名前記入欄
========================================================= */

.sideNameBlank{

    display:block;

    margin-top:3mm;

    width:20mm;

    min-height:48mm;

    writing-mode:vertical-rl;

    text-align:center;

    font-size:13px;

    font-weight:normal;

    color:#333;

    border:none !important;
}



/* =========================================================
   著作権・ロゴ
========================================================= */

.copyright{

    right:7mm;

   問題エリア
========================================================= */

.studentProblems{

    width:calc(100% - 30mm);

    height:190mm;

    display:grid;

    grid-template-columns:repeat(3, minmax(0, 1fr));

    gap:6mm;

    min-width:0;

    direction:rtl;
}



/* =========================================================
   問題カード
========================================================= */

.studentProblem{

    min-width:0;

    width:100%;
    height:190mm;

    border:1px solid #cdbfe0;

    border-top:4px solid var(--brand);

    border-radius:4px;

    overflow:hidden;

    background:#fff;

    display:flex;
    flex-direction:column;

    direction:ltr;
}



/* =========================================================
   問題番号ヘッダー
========================================================= */

.problemHeader{

    height:17mm;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-bottom:1px solid #d8cee2;
}



/* =========================================================
   問題番号
========================================================= */

    border-radius:4px;

    align-items:center;

        "Yu Kyokasho",

/* =========================================================
   問題内部
========================================================= */

.problemContent{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:row-reverse;

/* =========================================================
   本文
========================================================= */

    padding-left:4mm;

    flex-direction:column;

========================================================= */

    border-radius:12px;

    padding:2px 9px;

    margin-bottom:3mm;

    writing-mode:horizontal-tb;
}



/* =========================================================
   本文縦書き
========================================================= */

.verticalText{

    flex:1;

    min-height:0;

    width:100%;

    writing-mode:vertical-rl;

    text-orientation:mixed;

    display:flex;

    justify-content:flex-start;

    align-items:center;

========================================================= */

========================================================= */

    justify-content:flex-start;

/* =========================================================

========================================================= */

/* =========================================================

========================================================= */

.teacherFooter{

/* =========================================================

========================================================= */

@media print{

<script>



/* =========================================================
   今回のサンプル
========================================================= */

const sampleText = `===問題1===

本文
机の上に赤いりんごがあります。私は朝、そのりんごを食べました。

問題
「そのりんご」は何を指していますか。本文から探して答えましょう。

===問題2===

本文
公園に大きな犬がいました。私はその犬を見ながら、ベンチに座りました。

問題
「その犬」は何を指していますか。本文から探して答えましょう。

===問題3===

本文
教室の後ろに新しい本が置いてありました。私は休み時間に、その本を読みました。

問題
「その本」は何を指していますか。本文から探して答えましょう。

===教師用===

①
正解例：
赤いりんご

根拠箇所：
「机の上に赤いりんごがあります」

指導ポイント：
指示語「その」の直前にある名詞に注目します。「そのりんご」が何を指しているかを本文から探し、「赤いりんご」と答えます。

②
正解例：
大きな犬

根拠箇所：
「公園に大きな犬がいました」

指導ポイント：
「その犬」の「犬」と同じものを本文から探します。直前の文にある「大きな犬」が答えになります。

③
正解例：
新しい本

根拠箇所：
「教室の後ろに新しい本が置いてありました」

指導ポイント：
「その本」が指しているものを本文から探します。「本」という言葉だけでなく、本文に書かれている「新しい本」まで正しく答えられるようにします。`;



/* =========================================================
   レベル1
========================================================= */

const skillGuideData = {

    level:"レベル易",

    text:
        "<strong>指示語が指している具体的なものを見つける力</strong>を身につけます。<br><br>" +

        "「これ・それ・この・その」などの指示語が、文の中の<strong>どの言葉を指しているのか</strong>を探します。" +

        "まずは、指示語と指している言葉を正しく結びつけることを目指します。"
};



/* =========================================================
   サンプル読み込み
========================================================= */

function loadSample(){

    document.getElementById(
        "inputText"
    ).value = sampleText;

    makePrint();
}



/* =========================================================
   テキスト整形
========================================================= */

function cleanText(text){

    return text
        .replace(/<br\s*\/?>/gi,"\n")
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n")
        .trim();
}



/* =========================================================
   問題部分を取り出す
========================================================= */

function getProblemSection(text,number){

    const startMarker =
        "===問題" + number + "===";

    const start =
        text.indexOf(startMarker);

    if(start === -1){
        return "";
    }

    const contentStart =
        start + startMarker.length;

    let nextMarker = "";

    if(number < 3){

        nextMarker =
            "===問題" + (number + 1) + "===";

    }else{

        nextMarker =
            "===教師用===";
    }

    const end =
        text.indexOf(nextMarker,contentStart);

    if(end === -1){

        return text
            .substring(contentStart)
            .trim();
    }

    return text
        .substring(contentStart,end)
        .trim();
}



/* =========================================================
   本文と問題を分離
========================================================= */

function parseProblem(section){

    let body = "";
    let question = "";

    const bodyIndex =
        section.indexOf("本文");

    const questionIndex =
        section.indexOf("問題");

    if(
        bodyIndex !== -1 &&
        questionIndex !== -1 &&
        questionIndex > bodyIndex
    ){

        body =
            section
                .substring(
                    bodyIndex + 2,
                    questionIndex
                )
                .trim();

        question =
            section
                .substring(
                    questionIndex + 2
                )
                .trim();

    }else{

        body = section.trim();
    }

    return {
        body:body,
        question:question
    };
}

/* =========================================================
   教師用部分を取得
========================================================= */

function getTeacherSection(text){

    const marker =
        "===教師用===";

    const index =
        text.indexOf(marker);

    if(index === -1){
        return "";
    }

    return text
        .substring(
            index + marker.length
        )
        .trim();
}



/* =========================================================
   教師用問題を分離
========================================================= */

function parseTeacher(text){

    const teacher =
        getTeacherSection(text);

    if(!teacher){
        return [];
    }

    return teacher

        .split(
            /(?=^\s*[①②③]\s*)/m
        )

        .map(
            x => x.trim()
        )

        .filter(
            x => x
        );
}



/* =========================================================
   教師用カード
========================================================= */

function createTeacherProblem(
    number,
    text
){

    const card =
        document.createElement("div");

    card.className =
        "teacherProblem";



    const title =
        document.createElement("div");

    title.className =
        "teacherProblemTitle";

    title.textContent =
        "問題" + number;



    const content =
        document.createElement("div");

    content.className =
        "teacherProblemText";



    content.textContent =
        text
            .replace(
                /^\s*[①②③]\s*/,
                ""
            )
            .trim();



    card.appendChild(
        title
    );

    card.appendChild(
        content
    );



    return card;
}



/* =========================================================
   プリント作成
========================================================= */

function makePrint(){

    let text =
        document.getElementById(
            "inputText"
        ).value;



    text =
        cleanText(text);



    if(!text){

        alert(
            "問題文を貼り付けてください。"
        );

        return;
    }



    /* ---------- 設定 ---------- */

    const title =
        document.getElementById(
            "titleInput"
        ).value.trim()
        || "指示語特訓プリント";



    document.querySelector(
        ".sideTitle"
    ).textContent =
        title;



    document.getElementById(
        "studentLevel"
    ).textContent =
        "レベル易";



    document.getElementById(
        "teacherLevel"
    ).textContent =
        "レベル易";



    /* ---------- 身につけたい力 ---------- */

    document.getElementById(
        "skillGuideLevel"
    ).textContent =
        skillGuideData.level;



    document.getElementById(
        "skillGuideText"
    ).innerHTML =
        skillGuideData.text;



    /* ---------- 問題数 ---------- */

    const problemCount = 3;



    /* =====================================================
       生徒用
    ===================================================== */

    const studentProblems =
        document.getElementById(
            "studentProblems"
        );

    studentProblems.innerHTML = "";



    for(
        let i = 1;
        i <= problemCount;
        i++
    ){

        const section =
            getProblemSection(
                text,
                i
            );



        if(!section){
            continue;
        }



        const data =
            parseProblem(
                section
            );



        studentProblems.appendChild(

            createStudentProblem(
                i,
                data
            )

        );
    }



    /* =====================================================
       教師用
    ===================================================== */

    const teacherProblems =
        document.getElementById(
            "teacherProblems"
        );

    teacherProblems.innerHTML = "";



    const teacherData =
        parseTeacher(
            text
        );



    teacherData

        .slice(
            0,
            problemCount
        )

        .forEach(
            function(text,index){

                teacherProblems.appendChild(

                    createTeacherProblem(
                        index + 1,
                        text
                    )

                );

            }
        );
}
